<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="bgRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    
    <linearGradient id="ringTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="ringDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Path for curved text -->
    <path id="textArc" d="M 100,250 A 150,150 0 0,0 400,250" />
  </defs>

  <g filter="url(#shadow)">
    <!-- Outer Ring Base -->
    <circle cx="250" cy="250" r="235" fill="none" stroke="#e2e8f0" stroke-width="24" />
    
    <!-- Left Ring Arc (Dark Indigo) -->
    <path d="M 250,15 A 235,235 0 0,0 250,485" fill="none" stroke="url(#ringDark)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Right Ring Arc (Teal) -->
    <path d="M 250,15 A 235,235 0 0,1 250,485" fill="none" stroke="url(#ringTeal)" stroke-width="26" stroke-linecap="round" />

    <!-- Inner Circle Split Clip Background -->
    <!-- Left Inner Circle -->
    <path d="M 250,30 A 220,220 0 0,0 250,470 Z" fill="url(#bgLeft)"/>
    
    <!-- Right Inner Circle -->
    <path d="M 250,30 A 220,220 0 0,1 250,470 Z" fill="url(#bgRight)"/>

    <!-- Center Separator Line -->
    <line x1="250" y1="30" x2="250" y2="470" stroke="#06b6d4" stroke-width="4" opacity="0.8"/>

    <!-- LEFT SIDE CONTENT: Circuit Board Traces & "AI" -->
    <!-- Circuit Lines & Nodes -->
    <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.7">
      <path d="M 80,160 L 150,160 L 175,190" />
      <circle cx="80" cy="160" r="5" fill="#38bdf8" stroke="none" />
      
      <path d="M 60,250 L 120,250" />
      <circle cx="60" cy="250" r="4" fill="#38bdf8" stroke="none" />
      
      <path d="M 90,320 L 140,320 L 160,300" />
      <circle cx="90" cy="320" r="5" fill="#38bdf8" stroke="none" />
      
      <path d="M 180,100 L 180,150 L 210,180" />
      <circle cx="180" cy="100" r="4" fill="#38bdf8" stroke="none" />

      <path d="M 140,380 L 180,380 L 200,350" />
      <circle cx="140" cy="380" r="4" fill="#38bdf8" stroke="none" />
    </g>

    <!-- Bold "AI" Text on Left -->
    <text x="145" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="#ffffff" letter-spacing="-2" text-anchor="middle" filter="url(#glow)">AI</text>

    <!-- RIGHT SIDE CONTENT: Digital Circuit Brain -->
    <g transform="translate(250, 80) scale(0.7)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Brain Hemisphere Outline & Circuits -->
      <path d="M 40,80 Q 90,20 160,40 Q 230,60 220,140 Q 240,220 180,280 Q 120,330 60,300 Q 20,260 30,190 Q 10,130 40,80 Z" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="5" />
      
      <!-- Inner Brain Neural Network Lines & Nodes -->
      <path d="M 50,120 Q 100,100 150,140" stroke="#a5f3fc" />
      <circle cx="50" cy="120" r="7" fill="#22d3ee" stroke="#ffffff" stroke-width="2" />
      <circle cx="150" cy="140" r="7" fill="#22d3ee" stroke="#ffffff" stroke-width="2" />

      <path d="M 80,190 L 140,190 L 180,160" stroke="#a5f3fc" />
      <circle cx="80" cy="190" r="6" fill="#ffffff" />
      <circle cx="180" cy="160" r="7" fill="#22d3ee" stroke="#ffffff" stroke-width="2" />

      <path d="M 60,250 Q 110,230 160,260" stroke="#a5f3fc" />
      <circle cx="60" cy="250" r="7" fill="#22d3ee" stroke="#ffffff" stroke-width="2" />
      <circle cx="160" cy="260" r="6" fill="#ffffff" />

      <path d="M 120,80 L 120,130 L 170,100" stroke="#a5f3fc" />
      <circle cx="120" cy="80" r="6" fill="#ffffff" />
      <circle cx="170" cy="100" r="7" fill="#22d3ee" stroke="#ffffff" stroke-width="2" />

      <path d="M 130,220 L 190,220" stroke="#a5f3fc" />
      <circle cx="130" cy="220" r="6" fill="#ffffff" />
      <circle cx="190" cy="220" r="7" fill="#22d3ee" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Bottom Curved Banner Container -->
    <path d="M 75,340 A 205,205 0 0,0 425,340 L 400,430 A 180,180 0 0,1 100,430 Z" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Curved Text: INTERVIEWER PRO -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="6">
      <textPath href="#textArc" startOffset="50%" text-anchor="middle">
        INTERVIEWER PRO
      </textPath>
    </text>
  </g>
</svg>
